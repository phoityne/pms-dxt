name: 03_Linux Static Build (Alpine Docker)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Clone dependent repositories
        shell: bash
        run: |
          mkdir -p pms
          repos=("pty-mcp-server" \
                  "pms-ui-request" "pms-ui-response" "pms-ui-notification" \
                  "pms-infrastructure" "pms-infra-cmdrun" "pms-infra-procspawn" "pms-infra-socket" "pms-infra-watch" "pms-infra-serial" \
                  "pms-application-service" "pms-domain-service" "pms-domain-model")
          for repo in "${repos[@]}"; do
            echo "Cloning $repo..."
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done

      - name: Build static binary inside Alpine (musl)
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace/pms/pty-mcp-server \
            alpine:3 sh -c '
              apk --no-cache add binutils-gold curl gcc g++ git gmp-dev ncurses-dev ncurses-static \
                libffi-dev make xz tar perl zlib-dev zlib-static sudo libc6-compat gmp-static &&
              curl --proto "=https" --tlsv1.2 -sSf https://get-ghcup.haskell.org | sh &&
              source /root/.ghcup/env &&
              ghcup install ghc 9.6.7 &&
              ghcup set ghc 9.6.7 &&
              ghcup install cabal latest &&
              ghcup set cabal latest &&
              cabal update &&
              cabal build --enable-executable-static --ghc-options="-optl-static -optl-pthread"
            '

      - name: Copy binary to bin/
        shell: bash
        run: |
          mkdir -p bin
          BIN_PATH=$(find pms/pty-mcp-server/dist-newstyle -type f -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-linux-static

      - name: Compress binary using xz
        run: |
          xz -9 -T0 -k bin/pty-mcp-server-linux-static

      - name: Commit and push binary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/pty-mcp-server-linux-static.xz
          git commit -m "Add static binary for linux (.xz)" || echo "No changes to commit"
          git push origin main
