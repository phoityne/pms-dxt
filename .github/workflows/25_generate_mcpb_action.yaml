name: 05_Generate MCPB Action

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      - name: Run create_mcpb.sh
        run: |
          chmod +x ./create_mcpb.sh
          ./create_mcpb.sh "${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: "Release ${{ github.event.inputs.version }}"
          draft: false
          prerelease: false

      - name: Upload MCPB artifact(s)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./download/pty-mcp-server-${{ github.event.inputs.version }}.mcpb
          asset_name: pty-mcp-server-${{ github.event.inputs.version }}.mcpb
          asset_content_type: application/octet-stream
