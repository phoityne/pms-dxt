name: 03_Linux Static Build (Stack Musl)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clone dependent repositories
        shell: bash
        run: |
          mkdir -p pms
          repos=("pty-mcp-server" \
                  "pms-ui-request" "pms-ui-response" "pms-ui-notification" \
                  "pms-infrastructure" "pms-infra-cmdrun" "pms-infra-procspawn" "pms-infra-socket" "pms-infra-watch" "pms-infra-serial" \
                  "pms-application-service" "pms-domain-service" "pms-domain-model")
          for repo in "${repos[@]}"; do
            echo "Cloning $repo..."
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtinfo-dev zlib1g-dev musl-tools

      - name: Set up Haskell with GHC 9.6 and Stack
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          enable-stack: true
          stack-version: 'latest'

      - name: Configure stack.yaml for static build
        working-directory: pms/pty-mcp-server
        run: |
          cat <<EOF > stack.yaml
          resolver: lts-22.12
          system-ghc: false
          packages:
            - .
            - ../pms-ui-request
            - ../pms-ui-response
            - ../pms-ui-notification
            - ../pms-infrastructure
            - ../pms-infra-cmdrun
            - ../pms-infra-procspawn
            - ../pms-infra-socket
            - ../pms-infra-watch
            - ../pms-infra-serial
            - ../pms-application-service
            - ../pms-domain-service
            - ../pms-domain-model
          extra-deps:
            - serialport-0.5.6@sha256:c1039b56ff705784ae5ed46c8cd646e6a5850fba7328c6b78024da0a35f55ca8,1702
            - strip-ansi-escape-0.1.0.0@sha256:08f2ed93b16086a837ec46eab7ce8d27cf39d47783caaeb818878ea33c2ff75f,1628
            - hie-bios-0.16.0@sha256:ab659b627b4351ee78a60305c5bfe2b7d53078506415ec9f92da8f593614c4fb,13724
          ghc-options:
            "*": -optl-static -optl-pthread -fPIC
          EOF

      - name: Build static binary
        working-directory: pms/pty-mcp-server
        run: |
          stack build --copy-bins --local-bin-path .

      - name: Copy binary to bin/
        shell: bash
        run: |
          mkdir -p bin
          BIN_PATH=$(find pms/pty-mcp-server -maxdepth 1 -type f -executable -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-linux-static

      - name: Compress binary using xz
        run: |
          xz -9 -T0 -k bin/pty-mcp-server-linux-static

      - name: Commit and push binary
        shell: bash
        run: |
          git lfs install
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/pty-mcp-server-linux-static.xz
          git commit -m "Add static binary for linux (.xz)" || echo "No changes to commit"
          git push origin main
