name: Generate Static Binary on musl-gcc (Ubuntu)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install ghcup and GHC
        run: |
          curl -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 sh
          echo ". ~/.ghcup/env" >> ~/.bashrc
          source ~/.ghcup/env
          ghcup install ghc 9.6.7
          ghcup set ghc 9.6.7
          ghcup install cabal 3.10.1.0
          ghcup set cabal 3.10.1.0
        shell: bash

      - name: Clone PMS Repos
        shell: bash
        run: |
          mkdir -p pms bin
          repos=(pty-mcp-server pms-ui-request pms-ui-response pms-ui-notification pms-infrastructure pms-infra-cmdrun pms-infra-procspawn pms-infra-socket pms-infra-watch pms-infra-serial pms-application-service pms-domain-service pms-domain-model)
          for repo in "${repos[@]}"; do
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done

      - name: Set static build flags
        working-directory: pms/pty-mcp-server
        run: |
          # Create or overwrite cabal.project.local to enforce static linking.
          # -optl-static: Pass -static to the linker.
          # -optl-pthread: Pass -pthread to the linker for thread support.
          # -optl-Wl,--static: Explicitly tell the linker (via GHC) to link statically.
          # -no-pie: Disable Position Independent Executables, which are essentially shared objects.
          # cc-options: -static: Ensure the C compiler also links statically for any C dependencies.
          echo "package *" > cabal.project.local
          echo "  ghc-options: -optl-static -optl-pthread -optl-Wl,--static -no-pie" >> cabal.project.local
          echo "  cc-options: -static" >> cabal.project.local
        shell: bash

      - name: Build statically
        working-directory: pms/pty-mcp-server
        env:
          CC: musl-gcc # Use musl-gcc as the C compiler
        shell: bash
        run: |
          ~/.ghcup/bin/cabal update
          ~/.ghcup/bin/cabal build all

      - name: Copy built binary
        run: |
          # Find the built executable and copy it to the bin directory.
          BIN_PATH=$(find pms/pty-mcp-server/dist-newstyle/build -type f -name pty-mcp-server | head -n1)
          cp "$BIN_PATH" bin/pty-mcp-server-x86_64-unknown-linux-musl

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main # Pull latest changes before adding/committing
          git add bin/
          git commit -m "Add static binary for musl (Ubuntu)" || echo "No changes to commit"
          git push origin main
