name: Generate Static Binary on musl-gcc (Ubuntu)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential curl wget gcc make autoconf libtool pkg-config
        shell: bash

      - name: Install ghcup and GHC
        run: |
          curl -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 sh
          echo ". ~/.ghcup/env" >> ~/.bashrc
          source ~/.ghcup/env
          ghcup install ghc 9.6.7
          ghcup set ghc 9.6.7
          ghcup install cabal 3.10.1.0
          ghcup set cabal 3.10.1.0
        shell: bash

      - name: Clone PMS Repos
        run: |
          mkdir -p pms bin
          repos=(pty-mcp-server pms-ui-request pms-ui-response pms-ui-notification pms-infrastructure pms-infra-cmdrun pms-infra-procspawn pms-infra-socket pms-infra-watch pms-infra-serial pms-application-service pms-domain-service pms-domain-model)
          for repo in "${repos[@]}"; do
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done
        shell: bash

      - name: Build and install GMP for musl
        run: |
          GMP_VERSION="6.3.0"
          wget https://gmplib.org/download/gmp/gmp-${GMP_VERSION}.tar.xz
          tar -xf gmp-${GMP_VERSION}.tar.xz
          cd gmp-${GMP_VERSION}
          ./configure --host=x86_64-linux-musl --build=x86_64-linux-gnu --disable-shared --enable-static --prefix=/usr/local/musl \
            CC=musl-gcc AR=musl-ar RANLIB=musl-ranlib
          make -j$(nproc)
          sudo make install
          cd ..
        shell: bash
        env:
          CC: musl-gcc
          AR: musl-ar
          RANLIB: musl-ranlib

      - name: Set static build flags
        working-directory: pms/pty-mcp-server
        run: |
          echo "package *" > cabal.project.local
          echo "  ghc-options: -optl-static -optl-pthread -optl-Wl,--static -optl-Wl,-no-pie -fno-PIC" >> cabal.project.local
          echo "  cc-options: -static -fno-PIC" >> cabal.project.local
          echo "  extra-lib-dirs: /usr/local/musl/lib" >> cabal.project.local
          echo "  extra-include-dirs: /usr/local/musl/include" >> cabal.project.local
        shell: bash

      - name: Build statically
        working-directory: pms/pty-mcp-server
        env:
          CC: musl-gcc
          LD: musl-gcc
          AR: musl-ar
          RANLIB: musl-ranlib
          CFLAGS: "-static -fno-PIC -I/usr/local/musl/include"
          LDFLAGS: "-static -Wl,--static -Wl,-no-pie -L/usr/local/musl/lib"
          PKG_CONFIG_PATH: /usr/lib/musl/pkgconfig:/usr/local/lib/musl/pkgconfig:/usr/local/musl/lib/pkgconfig
        run: |
          ~/.ghcup/bin/cabal update
          ~/.ghcup/bin/cabal configure --disable-shared --enable-static --with-gcc=musl-gcc all
          ~/.ghcup/bin/cabal build all --disable-shared --disable-executable-dynamic
        shell: bash

      - name: Copy built binary to bin/
        run: |
          BIN_PATH=$(find pms/pty-mcp-server/dist-newstyle/build -type f -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found!"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-x86_64-unknown-linux-musl
        shell: bash

      - name: Commit and push built binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/
          git commit -m "Add static binary built on Alpine" || echo "No changes to commit"
          git push origin main
        shell: bash
