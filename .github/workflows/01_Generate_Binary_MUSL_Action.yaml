name: Generate Binary MUSL Action

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build static binary with musl
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up GHC & Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.7
          cabal-version: 3.12.1.0

      - name: Install system dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y musl-tools

      - name: Prepare build directories
        run: |
          mkdir -p pms bin

      - name: Clone repositories
        run: |
          repos=("pty-mcp-server" \
                 "pms-ui-request" "pms-ui-response" "pms-ui-notification" \
                 "pms-infrastructure" "pms-infra-cmdrun" "pms-infra-procspawn" \
                 "pms-infra-socket" "pms-infra-watch" "pms-infra-serial" \
                 "pms-application-service" "pms-domain-service" "pms-domain-model")

          for repo in "${repos[@]}"; do
            dir="pms/$repo"
            echo "Cloning $repo into $dir"
            git clone https://github.com/phoityne/$repo.git "$dir"
          done

      - name: Create cabal.project.local
        working-directory: pms/pty-mcp-server
        run: |
          echo "package *" > cabal.project.local
          echo "  ghc-options: -optc -fPIC -optl-static -optl-pthread" >> cabal.project.local
          echo "  cc-options: -static" >> cabal.project.local
          echo "program-locations:" >> cabal.project.local
          echo "  gcc: /usr/bin/musl-gcc" >> cabal.project.local

      - name: Build
        working-directory: pms/pty-mcp-server
        env:
          CC: /usr/bin/musl-gcc
        run: |
          cabal update
          cabal build all

      - name: Copy binary to bin/
        run: |
          BIN_PATH=$(find pms/pty-mcp-server/dist-newstyle/build -type f -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-x86_64-unknown-linux-musl

      - name: Commit and push binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/
          git commit -m "Add static binary for x86_64-unknown-linux-musl" || echo "No changes to commit"
          git push origin main
