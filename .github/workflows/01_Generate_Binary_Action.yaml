name: Generate Binary Action

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
#          - os: ubuntu-latest
#            target: aarch64-unknown-linux-gnu
#          - os: macos-latest
#            target: x86_64-apple-darwin
#          - os: macos-latest
#            target: aarch64-apple-darwin
#          - os: windows-latest
#            target: x86_64-w64-mingw32

    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up GHC & Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.6.7
          cabal-version: 3.12.1.0

      - name: Install system dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Prepare build directories
        run: |
          mkdir -p pms bin

      - name: Clone repositories
        run: |
          repos=("pty-mcp-server" \
                 "pms-ui-request" "pms-ui-response" "pms-ui-notification" \
                 "pms-infrastructure" "pms-infra-cmdrun" "pms-infra-procspawn" "pms-infra-socket" "pms-infra-watch" "pms-infra-serial" \
                 "pms-application-service" "pms-domain-service" "pms-domain-model")
          for repo in "${repos[@]}"; do
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done

      - name: Create cabal.project with cross options
        working-directory: pms
        run: |
          echo "packages:" > cabal.project
          for dir in *; do
            if [ -d "$dir" ]; then
              echo "  $dir" >> cabal.project
            fi
          done
          echo "" >> cabal.project
          echo "program-locations:" >> cabal.project
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              echo "  gcc: /usr/bin/musl-gcc" >> cabal.project
              ;;
            aarch64-unknown-linux-gnu)
              echo "  gcc: /usr/bin/aarch64-linux-gnu-gcc" >> cabal.project
              ;;
          esac
          echo "" >> cabal.project
          echo "package *" >> cabal.project
          echo "  ghc-options: -optc -fPIC -optl-static -optl-pthread" >> cabal.project

      - name: Build all packages
        working-directory: pms
        run: |
          cabal update
          cabal build all

      - name: Copy binary to bin/
        run: |
          BIN_PATH=$(find pms/dist-newstyle/build -type f -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-${{ matrix.target }}

      - name: Commit and push binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/
          git commit -m "Add static binary for ${{ matrix.target }}" || echo "No changes to commit"
          git push origin main
