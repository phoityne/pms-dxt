name: 05_pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Clone dependent repositories
        shell: bash
        run: |
          mkdir -p pms
          repos=("pty-mcp-server" \
                 "pms-ui-request" "pms-ui-response" "pms-ui-notification" \
                 "pms-infrastructure" "pms-infra-cmdrun" "pms-infra-procspawn" "pms-infra-socket" "pms-infra-watch" "pms-infra-serial" \
                 "pms-application-service" "pms-domain-service" "pms-domain-model")
          for repo in "${repos[@]}"; do
            echo "Cloning $repo..."
            git clone https://github.com/phoityne/$repo.git pms/$repo
          done

      - name: Set up Nix
        uses: cachix/install-nix-action@v25

#      - name: Show nix flake outputs
#        shell: bash
#        run: |
#          nix flake show github:input-output-hk/devx

      - name: Create cabal.project file
        working-directory: pms/pty-mcp-server
        shell: bash
        run: |
          printf "packages: ../*\n" > cabal.project

      - name: Inject fake libutil.h for musl
        working-directory: pms/pty-mcp-server
        run: |
          mkdir -p fake-libutil
          echo '#ifndef _LIBUTIL_H' > fake-libutil/libutil.h
          echo '#define _LIBUTIL_H' >> fake-libutil/libutil.h
          echo '' >> fake-libutil/libutil.h
          echo '#include <pty.h>' >> fake-libutil/libutil.h
          echo '#include <unistd.h>' >> fake-libutil/libutil.h
          echo '' >> fake-libutil/libutil.h
          echo '#endif' >> fake-libutil/libutil.h

      - name: Build statically with Nix (with fake libutil)
        working-directory: pms/pty-mcp-server
        env:
          C_INCLUDE_PATH: ${{ github.workspace }}/pms/pty-mcp-server/fake-libutil
        run: |
          nix develop github:input-output-hk/devx#ghc96-static-iog-full -c bash -c '
            cabal update
            cabal build all --ghc-options="-fPIC -optl-static -optl-pthread -optl-static-libgcc"
          '

      - name: Copy and strip binary
        shell: bash
        run: |
          mkdir -p bin
          BIN_PATH=$(find pms/pty-mcp-server/dist-newstyle/build -type f -name pty-mcp-server | head -n1)
          if [ -z "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl
          du -sk bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl
          strip bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl || echo "strip failed"
          du -sk bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

      - name: Compress binary using xz
        run: |
          xz -9 -T0 -k -f bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

      - name: Commit and push compressed binary
        shell: bash
        run: |
          ls -la bin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl.xz
          git commit -m "Add compressed static binary for Linux (.xz)" || echo "No changes to commit"
          git push origin main
