name: 05_pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trigger repo
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v25

      - name: Inject fake libutil.h for musl
        run: |
          mkdir -p fake-libutil
          echo '#ifndef _LIBUTIL_H' > fake-libutil/libutil.h
          echo '#define _LIBUTIL_H' >> fake-libutil/libutil.h
          echo '' >> fake-libutil/libutil.h
          echo '#include <pty.h>' >> fake-libutil/libutil.h
          echo '#include <unistd.h>' >> fake-libutil/libutil.h
          echo '' >> fake-libutil/libutil.h
          echo '#endif' >> fake-libutil/libutil.h

      - name: Install and build pty-mcp-server from Hackage
        env:
          C_INCLUDE_PATH: ${{ github.workspace }}/fake-libutil
        run: |
          nix develop github:input-output-hk/devx#ghc96-static-iog-full -c bash -c '
            cabal update
            cabal install pty-mcp-server \
              --installdir=bin \
              --install-method=copy \
              --overwrite-policy=always \
              --ghc-options="-optl-static -optl-pthread -optl-static-libgcc"
          '

      - name: Copy and strip binary
        shell: bash
        run: |
          BIN_PATH=bin/pty-mcp-server
          if [ ! -f "$BIN_PATH" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BIN_PATH" bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl
          du -sk bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl
          strip bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl || echo "strip failed"
          du -sk bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

      - name: Compress binary using xz
        run: |
          xz -9 -T0 -k -f bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl

      - name: Commit and push compressed binary
        shell: bash
        run: |
          ls -la bin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add bin/pty-mcp-server-nix-shell-x86_64-unknown-linux-musl.xz
          git commit -m "Add compressed static binary for Linux (.xz)" || echo "No changes to commit"
          git push origin main
